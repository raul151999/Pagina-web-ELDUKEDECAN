<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ELDUKEDECAN — Veterinaria en Trujillo, Perú</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veterinaria ELDUKEDECAN — Más de 20 años cuidando a tu mascota en Trujillo, Perú. Consultas, vacunas, cirugías, grooming y las mejores marcas de alimento.">
  <meta name="theme-color" content="#004a59">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Netlify Hidden Form for Reclamos -->
  <form name="reclamos" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="nombres" />
    <input type="text" name="apellidos" />
    <input type="text" name="dni" />
    <input type="email" name="correo" />
    <input type="tel" name="celular" />
    <input type="text" name="domicilio" />
    <input type="text" name="referencia" />
    <select name="tipo_bien"></select>
    <select name="categoria"></select>
    <select name="sede"></select>
    <input type="text" name="colaborador" />
    <input type="text" name="mascota" />
    <select name="motivo"></select>
    <textarea name="detalle"></textarea>
  </form>
  <app-root></app-root>
</body>
</html>

<section class="video-section">
  <div class="container">
    <div class="section-header">
      <div class="play-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
      </div>
      <h2 class="section-title">DESCUBRE PRODUCTOS QUE HARÁN MÁS FELIZ A TU MASCOTA</h2>
      <span class="video-count">{{ videoUrls.length }} videos</span>
    </div>
    
    <div class="carousel-container">
      <div class="video-carousel">
        @for (safeUrl of videoUrls; track $index) {
          <div class="video-card">
             <iframe 
               [src]="safeUrl" 
               frameborder="0" 
               allow="encrypted-media;" 
               allowfullscreen>
             </iframe>
          </div>
        }
      </div>
    </div>
  </div>
</section>
